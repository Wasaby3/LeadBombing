name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    name: Build

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            dist: linux

          - os: macos-14
            dist: macos-arm

          - os: windows-2022
            dist: windows

    runs-on: ${{ matrix.os }}

    steps:
    - name: Get the version
      id: get_version
      run: echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
      shell: bash

    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e .[dev]

    - name: Build standalone app
      run: |
        python setup.py build_standalone

    - name: Archive Windows distributive
      if: matrix.dist == 'windows'
      run: pushd dist && 7z a ../LeadBombing-${{steps.get_version.outputs.version}}-${{matrix.dist}}.zip LeadBombing.exe && popd
      shell: bash

    - name: Archive Linux/MacOS distributive
      if: matrix.dist != 'windows'
      run: tar -C dist/ -czvf LeadBombing-${{steps.get_version.outputs.version}}-${{matrix.dist}}.tar.gz LeadBombing
      shell: bash

    - name: Upload distributive
      uses: actions/upload-artifact@v4
      with:
        name: dist-${{ matrix.dist }}
        path: LeadBombing-*
        retention-days: 5

  release:
    name: Release

    needs: [build]

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Get the version
      id: get_version
      run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
      shell: bash

    - uses: actions/checkout@v4

    - name: Get Changelog Entry
      id: changelog_reader
      uses: mindsers/changelog-reader-action@v2
      with:
        version: ${{ steps.get_version.outputs.version }}
        path: ./CHANGELOG.md

    - uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true

    - uses: ncipollo/release-action@v1
      with:
        tag: v${{ steps.changelog_reader.outputs.version }}
        name: LeadBombing ${{ steps.changelog_reader.outputs.version }}
        body: ${{ steps.changelog_reader.outputs.changes }}
        prerelease: ${{ steps.changelog_reader.outputs.status == 'prereleased' }}
        draft: true
        artifacts: "artifacts/*"
        allowUpdates: true
        token: ${{ secrets.GITHUB_TOKEN }}
