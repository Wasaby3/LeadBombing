# LeadBombing на VPS рядом с bani-pwa: /opt/leadbombing/docker-compose.yml (кладёт scripts/deploy/server.sh).
# Наружу ничего не открыто: порт только на 127.0.0.1 (доступ — SSH-туннель). Supabase — общий стек bani-pwa,
# к его API контейнер ходит по внутренней сети docker (api-gw:8000), схема своя — leadbombing.
name: leadbombing

services:
  app:
    image: leadbombing:${LEADBOMBING_TAG:?LEADBOMBING_TAG не задан}
    container_name: leadbombing
    restart: unless-stopped
    # Chrome с окном в виртуальном дисплее: так 2GIS видит обычный браузер, а карте есть настоящий экран.
    command: ["xvfb-run", "-a", "-s", "-screen 0 1920x1080x24", "leadbombing"]
    env_file: .env  # SUPABASE_URL, SUPABASE_ANON_KEY, LEADBOMBING_SECRET_KEY — создаёт server.sh setup, chmod 600
    environment:
      LEADBOMBING_HOST: 0.0.0.0
      LEADBOMBING_OPEN_BROWSER: "0"
    ports:
      - "127.0.0.1:8666:8666"
    volumes:
      - ./data:/home/app/.local/share/leadbombing  # фото лидов папок, запуски поиска
    mem_limit: 1536m  # пробный поиск: пик 1.0 ГБ; при нехватке падает этот контейнер, а не бани
    shm_size: 1g
    networks: [supabase]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8666/search', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

networks:
  supabase:
    external: true
    name: supabase_default
